<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3a6ff7">
<title>맨처음 토익 RC · 학습앱</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="토익 RC">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-bar">
    <button class="back hidden" id="backBtn">←</button>
    <div class="logo">맨처음 토익 RC<small id="barTitle">학습앱</small></div>
    <div class="spacer"></div>
    <div style="font-size:22px">🎯</div>
  </header>

  <main id="screen"><!-- 동적 렌더링 --></main>

  <nav class="tabbar">
    <button data-tab="home" class="active"><span class="ic">🏠</span>홈</button>
    <button data-tab="study"><span class="ic">📚</span>학습</button>
    <button data-tab="exam"><span class="ic">⏱️</span>모의고사</button>
    <button data-tab="stats"><span class="ic">📊</span>통계</button>
  </nav>

  <!-- 데이터 & 앱 로직 (classic) -->
  <script src="firebase-config.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <!-- Firebase 실시간 동기화 (module, app.js 이후 실행) -->
  <script type="module" src="cloud.js"></script>

  <!-- PWA 서비스워커 등록 -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", ()=>{
        navigator.serviceWorker.register("sw.js").catch(e=> console.warn("SW 등록 실패:", e));
      });
    }
  </script>
</body>
</html>
